<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 435" width="850" height="435">
  <style>
    .cmd { fill: #7ee787; font-family: 'Courier New', monospace; font-size: 14px; }
    .out { fill: #e6edf3; font-family: 'Courier New', monospace; font-size: 14px; }
    .hi  { fill: #d2a8ff; font-family: 'Courier New', monospace; font-size: 14px; }
    .dim { fill: #8b949e; font-family: 'Courier New', monospace; font-size: 13px; }

    .line { opacity: 0; }

    .l1  { animation: t 0.01s 0.4s forwards; }
    .l2  { animation: t 0.01s 1.2s forwards; }
    .l3  { animation: t 0.01s 2.2s forwards; }
    .l4  { animation: t 0.01s 3.0s forwards; }
    .l5  { animation: t 0.01s 3.6s forwards; }
    .l6  { animation: t 0.01s 4.6s forwards; }
    .l7  { animation: t 0.01s 5.4s forwards; }
    .l8  { animation: t 0.01s 6.4s forwards; }
    .l9  { animation: t 0.01s 7.1s forwards; }
    .l10 { animation: t 0.01s 7.7s forwards; }
    .l11 { animation: t 0.01s 8.7s forwards; }
    .l12 { animation: t 0.01s 9.5s forwards; }

    @keyframes t { to { opacity: 1; } }

    .cursor {
      animation: blink 1s step-end infinite 9.8s;
      opacity: 0;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Terminal frame -->
  <rect width="850" height="435" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect width="850" height="36" rx="12" fill="#161b22"/>
  <rect y="12" width="850" height="24" fill="#161b22"/>
  <circle cx="22" cy="18" r="6.5" fill="#ff5f57"/>
  <circle cx="44" cy="18" r="6.5" fill="#febc2e"/>
  <circle cx="66" cy="18" r="6.5" fill="#28c840"/>
  <text x="425" y="23" text-anchor="middle" class="dim">prakash@nitc: ~</text>

  <!-- Line 1: whoami -->
  <text x="25" y="65" class="cmd line l1">$ whoami</text>

  <!-- Line 2: name output -->
  <text x="25" y="90" class="out line l2">  Prakash Kumar Sarangi</text>

  <!-- Line 3: cat education -->
  <text x="25" y="130" class="cmd line l3">$ cat education.txt</text>

  <!-- Line 4: M.Tech -->
  <text x="25" y="155" class="out line l4">  M.Tech CSE @ NIT Calicut (2025–2027)</text>

  <!-- Line 5: B.Tech -->
  <text x="25" y="178" class="out line l5">  B.Tech CSE @ TMSL Kolkata (2019–2023)</text>

  <!-- Line 6: cat experience -->
  <text x="25" y="218" class="cmd line l6">$ cat experience.txt</text>

  <!-- Line 7: experience output -->
  <text x="25" y="243" class="out line l7">  2 YOE · Ex-TCS · Java · Spring Boot · Backend</text>

  <!-- Line 8: cat skills -->
  <text x="25" y="283" class="cmd line l8">$ cat skills.txt</text>

  <!-- Line 9: skills line 1 -->
  <text x="25" y="308" class="out line l9">  Java · Python · C/C++ · Spring Boot · React · Flask</text>

  <!-- Line 10: skills line 2 -->
  <text x="25" y="331" class="out line l10">  Distributed Systems · AI/ML · Docker · PostgreSQL</text>

  <!-- Line 11: echo status -->
  <text x="25" y="371" class="cmd line l11">$ echo $STATUS</text>

  <!-- Line 12: status output -->
  <text x="25" y="396" class="hi line l12">  "Building things that scale, break, and teach."</text>

  <!-- Blinking cursor -->
  <rect x="25" y="410" width="9" height="16" rx="1" fill="#7ee787" class="cursor"/>
</svg>
