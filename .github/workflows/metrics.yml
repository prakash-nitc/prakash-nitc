name: Generate Metrics

on:
  schedule:
    - cron: "30 0 * * *" # Daily, 30 min after the snake job
  workflow_dispatch: # Allow manual trigger
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

# Why this exists: the profile previously embedded github-readme-stats,
# github-profile-trophy and github-readme-activity-graph from public Vercel
# instances. Those deployments went 402/503 (DEPLOYMENT_DISABLED / PAUSED) and
# rendered "Something went wrong" cards on the profile. Rendering the SVGs here
# and committing them means there is no third-party host in the page-load path.
#
# METRICS_TOKEN (a classic PAT with `public_repo` + `read:user`) unlocks the full
# dataset. Without it the job still succeeds on the repo-scoped GITHUB_TOKEN,
# just with thinner numbers.

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    # The languages and achievements plugins must enumerate every repo the user
    # owns. GITHUB_TOKEN is scoped to THIS repo, so without a PAT they render
    # "0 Languages" and "Unexpected error". Gate them rather than commit a
    # broken card — they light up automatically once METRICS_TOKEN is added.
    env:
      HAS_PAT: ${{ secrets.METRICS_TOKEN != '' }}

    steps:
      - name: Overview — stats, activity, contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/overview.svg
          committer_branch: main
          committer_message: "chore(metrics): refresh overview card"
          # `repositories`/`community` need the PAT too; under GITHUB_TOKEN they
          # report "1 Repository / 0 Stargazers", which misrepresents the account.
          base: ${{ secrets.METRICS_TOKEN != '' && 'header, activity, community, repositories, metadata' || 'header, activity' }}
          base_indepth: yes
          # No contributions calendar here on purpose: the profile already shows
          # GitHub's native one, plus the snake animation below. A third grid is
          # noise.
          config_timezone: Asia/Kolkata
          config_animations: yes
          config_padding: 0, 8%
          plugins_errors_fatal: no
          retries: 3
          retries_delay: 30
          extras_css: &dark_css |
            svg { background: #0d1117; color: #c9d1d9; }
            h1 { color: #e8e8f0 !important; }
            h2, h3 { color: #4facfe !important; }
            h2 svg, h3 svg { fill: #4facfe !important; }
            .field { color: #c9d1d9; }
            small { color: #8b949e !important; }
            /* The contribution cells are emitted with GitHub's LIGHT palette as
               fill="" presentation attributes, which read as a white slab on a
               #0d1117 card. A CSS `fill` declaration outranks the attribute, so
               remap level-for-level onto the dark palette snake.yml already uses. */
            [fill="#ebedf0"] { fill: #161b22 !important; }
            [fill="#9be9a8"] { fill: #0e4429 !important; }
            [fill="#40c463"] { fill: #006d32 !important; }
            [fill="#30a14e"] { fill: #26a641 !important; }
            [fill="#216e39"] { fill: #39d353 !important; }

      - name: Languages — most used across all repositories
        if: env.HAS_PAT == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/languages.svg
          committer_branch: main
          committer_message: "chore(metrics): refresh languages card"
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          config_timezone: Asia/Kolkata
          config_animations: yes
          config_padding: 0, 8%
          plugins_errors_fatal: no
          retries: 3
          retries_delay: 30
          extras_css: *dark_css

      - name: Achievements — replaces the dead trophy service
        if: env.HAS_PAT == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/achievements.svg
          committer_branch: main
          committer_message: "chore(metrics): refresh achievements card"
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 0
          config_timezone: Asia/Kolkata
          config_animations: yes
          config_padding: 0, 8%
          plugins_errors_fatal: no
          retries: 3
          retries_delay: 30
          extras_css: *dark_css
